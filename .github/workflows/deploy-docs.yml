name: Deploy Docs Site
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  HUSKY: 0

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build site
        # withastro/action v6.1.3
        uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
